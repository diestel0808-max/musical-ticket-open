name: 수집

on:
  schedule:
    - cron: "0 23 * * *" # 매일 08:00 KST (UTC 23:00). GitHub 사정으로 수십 분 늦을 수 있음
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        run: python -m scraper.main

      - name: 데이터 커밋 (Vercel이 이 커밋을 보고 자동 재배포)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          git diff --cached --quiet && exit 0
          git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          # 사이트의 「지금 업데이트」 버튼이 그 사이 커밋했을 수 있으니 최신을 받아 위에 얹는다
          # (rebase에서 -X theirs = 방금 수집한 우리 쪽 결과를 우선)
          git pull --rebase -X theirs origin main
          git push
