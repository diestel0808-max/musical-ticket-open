name: 수집

on:
  schedule:
    # 07:17 KST (UTC 22:17). GitHub 예약 실행은 실제로 2~3시간 늦게 시작돼서(기록상 최대 3시간 15분)
    # 11시 전에 반영되도록 일찍 건다. 정각은 몰려서 더 밀리므로 17분에.
    - cron: "17 22 * * *"
    # 09:17 KST 예비 실행. GitHub는 바쁠 때 예약 실행을 건너뛰기도 해서(10/28) 한 번 더 건다.
    # 첫 실행이 잘 됐어도 해가 없고, 그 사이 올라온 소식까지 한 번 더 반영된다.
    - cron: "17 0 * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행
  push:
    branches: [main]
    paths: ["scraper/ongoing.py"] # 공연중 수집기를 고치면 바로 한 번 돌려 확인

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집
        run: python -m scraper.main

      - name: 공연중 수집 (KOPIS)
        env:
          KOPIS_KEY: ${{ secrets.KOPIS_KEY }}
        run: python -m scraper.ongoing

      - name: 데이터 커밋 + Vercel 배포
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          # 사이트의 「지금 업데이트」 버튼이 그 사이 커밋했을 수 있으니 최신을 받아 위에 얹는다
          # (rebase에서 -X theirs = 방금 수집한 우리 쪽 결과를 우선)
          git pull --rebase -X theirs origin main
          git push
          # Vercel이 GitHub 푸시를 놓치는 경우가 있어 Deploy Hook으로 직접 배포를 요청
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null && echo "Vercel 배포 요청함"; fi
